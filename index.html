<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F5EF" />
    <meta name="description" content="WildLens is an offline AI field guide. Look closer." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>WildLens</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('wildlens.settings') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-label="Loading WildLens">WildLens</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
